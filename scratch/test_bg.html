<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: red; }
.pl-hero-section {
  position: relative;
  z-index: 2;
  min-height: 100svh;
  display: block; /* simulate inline style */
}
.pl-scenes {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: transparent;
}
.pl-scene {
  position: absolute;
  inset: 0;
  opacity: 0;
}
.pl-scene.pl-on { opacity: 1; }
.pl-s1 { background: linear-gradient(178deg, #fbfffb 0%, #eafaec 24%, #d6f1dc 54%, #bfe8ca 100%); }
</style>
</head>
<body>
<purelane-hero class="pl-hero-section" style="display: block;">
  <div class="pl-scenes">
    <div class="pl-scene pl-s1 pl-on"></div>
  </div>
  <div style="position: relative; z-index: 2;">Text here</div>
</purelane-hero>
</body>
</html>
