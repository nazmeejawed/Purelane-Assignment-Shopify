<!DOCTYPE html>
<html>
<head>
<style>
body { background: #f4f0fb; margin: 0; }
.pl-hero-section {
  position: relative;
  z-index: 2;
  min-height: 100svh;
  display: flex;
  align-items: flex-end;
  padding: 150px 0 34px;
  background: transparent;
  overflow: hidden;
}
.pl-hero-section::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(102deg, rgba(255,255,255,.80) 0%, rgba(255,255,255,.50) 30%, rgba(255,255,255,.12) 54%, transparent 68%);
}
.pl-scenes {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background: transparent;
}
.pl-scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.5s ease;
}
.pl-scene.pl-on { opacity: 1; }
.pl-s1 { background: linear-gradient(178deg, #fbfffb 0%, #eafaec 24%, #d6f1dc 54%, #bfe8ca 100%); }
</style>
</head>
<body>
<purelane-hero class="pl-hero-section" style="display: block;">
  <div class="pl-scenes">
    <div class="pl-scene pl-s1 pl-on"></div>
  </div>
  <div style="position: relative; z-index: 2; width: 100%;">
    <h1>CLEAN THAT LASTS</h1>
  </div>
</purelane-hero>
</body>
</html>
